name: Build ImmortalWrtmt mt7981
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 扩容磁盘
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048

      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf wget curl git python3 python3-pip unzip ninja-build

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 拉取 lucky + pushbot 到 package
        run: |
          cd package
          [ ! -d luci-app-lucky ] && git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git
          [ ! -d luci-app-pushbot ] && git clone --depth 1 https://github.com/zzsj0928/luci-app-pushbot.git
          cd ..
      - name: tools/ninja补丁
        run: |
          sed -i 's/import pipes/import shlex/g' build_dir/host/ninja-*/configure.py
          sed -i 's/pipes.quote/shlex.quote/g' build_dir/host/ninja-*/configure.py
      - name: 复制自定义files目录
        run: |
          cp -r configs/files ./files

      - name: 导入你的配置
        run: |
          cp configs/mt7981.config .config
          make defconfig

      - name: 编译固件
        run: |
          make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: bin/targets/
